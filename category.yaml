########################################################################################
# MoviePilot 媒体分类配置文件
########################################################################################
#
# 配置说明：
# 1. 本配置文件用于配置电影和电视剧的分类策略
# 2. 一级分类名称：`movie`、`tv` 为固定名称，不可修改
# 3. 二级分类名称同时也是目录名称，会按先后顺序匹配，匹配后程序会按此名称建立二级目录
# 4. 配置多项条件时需要同时满足，一个条件需要匹配多个值时使用`,`分隔
# 5. !条件值 表示排除该值
#
# 支持的分类条件：
#   - original_language    : 语种
#   - production_countries : 电影-国家或地区
#   - origin_country       : 电视剧-国家或地区
#   - genre_ids            : 内容类型
#   - release_year         : 发行年份 (格式: YYYY 或 YYYY-YYYY)
#
# 注：themoviedb 详情API返回的其它一级字段也可作为分类条件
#
########################################################################################

# ==================== 电影分类配置 ====================
movie:
  # ----- 动画电影 -----
  动画电影:
    genre_ids: '16'  # 16=动漫

  # ----- 华语电影 -----
  华语电影:
    original_language: 'zh,cn,bo,za'  # 中文、粤语、藏语等

  # ----- 成人内容 -----
  # 📌 MetatubeSource 插件专用分类
  # 插件会自动识别并按以下子分类组织：
  #   - 成人/日系    : 日本番号内容 (FC2, HEYZO, SSIS, IPX, etc.)
  #   - 成人/欧美系  : 欧美成人内容 (BRAZZERS, BLACKED, VIXEN, etc.)
  #   - 成人/中文系  : 中文成人内容 (MDTV, JD, etc.)
  #   - 成人/其他    : 其他成人内容
  #
  # 注：此分类由 MetatubeSource 插件通过关键字匹配自动识别
  #     识别成功固定为「成人/日系」，识别失败根据关键字归类
  成人:

  # ----- 兜底分类 -----
  # 未匹配以上条件时，默认归类为外语电影
  外语电影:


# ==================== 电视剧分类配置 ====================
tv:
  # ----- 动漫 -----
  国漫:
    genre_ids: '16'  # 16=动漫
    origin_country: 'CN,TW,HK'  # 中国大陆、台湾、香港

  日番:
    genre_ids: '16'  # 16=动漫
    origin_country: 'JP'  # 日本

  # ----- 纪录片/儿童/综艺 -----
  纪录片:
    genre_ids: '99'  # 99=纪录片

  儿童:
    genre_ids: '10762'  # 10762=儿童

  综艺:
    genre_ids: '10764,10767'  # 10764/10767=综艺

  # ----- 剧集 -----
  国产剧:
    origin_country: 'CN,TW,HK'  # 中国大陆、台湾、香港

  欧美剧:
    origin_country: 'US,FR,GB,DE,ES,IT,NL,PT,RU,UK'  # 欧美国家

  日韩剧:
    origin_country: 'JP,KP,KR,TH,IN,SG'  # 日本、朝鲜、韩国及东南亚

  # ----- 兜底分类 -----
  # 未匹配以上分类时，默认归类为未分类
  未分类:


########################################################################################
# 附录：参考字典
