## ----- MetatubeSource 插件成人内容分类说明 -----
#
# 🎯 插件功能：
#   MetatubeSource 插件通过关键字匹配自动识别成人内容并分类
#
# 📂 分类结构：
#   movie/
#   └── 成人/
#       ├── 日系/     # 日本番号 (FC2, HEYZO, SSIS, IPX, MIAA, etc.)
#       ├── 欧美系/   # 欧美内容 (BRAZZERS, BLACKED, VIXEN, TUSHY, etc.)
#       ├── 中文系/   # 中文内容 (MDTV, JD, etc.)
#       └── 其他/     # 未匹配关键字的成人内容
#
# 🔍 识别规则：
#   1. Metatube API 识别成功 → 固定分类为「成人/日系」
#   2. Metatube API 识别失败 → 根据关键字匹配分类：
#      • 匹配日系关键字 → 成人/日系
#      • 匹配欧美关键字 → 成人/欧美系
#      • 匹配中文关键字 → 成人/中文系
#      • 未匹配关键字 → 成人/其他
#
# 📝 关键字示例：
#   日系关键字：
#     - 番号前缀: SSIS, IPX, MIAA, JUL, CAWD, FC2, HEYZO, CARIB, STAR, STARS, EBOD, WANZ
#     - 片商标识: S1, Moodyz, IdeaPocket, Madonna, Premium, kawaii, E-BODY, OPPAI
#     - 通用标识: JAV, DMM, FANZA, 一本道, 加勒比, 东京热
#
#   欧美关键字：
#     - 网站标识: BRAZZERS, NaughtyAmerica, RealityKings, Mofos
#     - Vixen系列: BLACKED, TUSHY, VIXEN, Deeper, Slayed
#     - 其他: XEmpire, 21Sextury
#
#   中文关键字：
#     - 番号格式: MDTV, MDX, MD, JD
#
# ⚙️ 配置说明：
#   - 关键字可在插件设置界面自定义
#   - 支持排除关键字（画质标记：4K, FHD, HDR, etc.）
#   - 识别失败时支持自动下载控制
#
# 📚 依赖服务：
#   • Metatube API   (http://127.0.0.1:3244) - 主要识别源
#   • ByteMuse API  (http://127.0.0.1:3750) - 辅助识别源
#   • ThePornDB API (https://theporndb.net) - 欧美内容识别
#
########################################################################################
