services:
  moviepilot:
    image: mubeyout/moviepilot:v3.0.0-patched
    container_name: Moviepilot
    restart: unless-stopped
    network_mode: host
    hostname: iStoreNextD
    working_dir: /app
    entrypoint: ["/usr/bin/tini", "-g", "--", "/config/v3_plugin_deploy.sh", "/usr/local/lib/moviepilot/control/entrypoint.sh"]
    environment:
      - CONFIG_DIR=/config
      - DISPLAY=:987
      - HTTP_PROXY=http://127.0.0.1:7890
      - HTTPS_PROXY=http://127.0.0.1:7890
      - MOVIEPILOT_AUTO_UPDATE=none
      - NGINX_PORT=3003
      - NO_PROXY=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16
      - PGID=0
      - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
      - PIP_TRUSTED_HOST=pypi.tuna.tsinghua.edu.cn
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      - PUID=0
      - SUPERUSER=mubey
      - TZ=Asia/Shanghai
      - UMASK=000
      - UV_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    volumes:
      # RW: config & plugin data
      - /mnt/sda1/Configs/MoviePilot:/config
      # 自有插件部署器（entrypoint 包装，拷贝而非 bind-mount——V3 插件安装器需 rename 插件目录，挂载点会 EBUSY）
      - /mnt/sda1/Configs/MoviePilot/v3_plugin_deploy.sh:/config/v3_plugin_deploy.sh:ro
      - /mnt/sda1/Configs/MoviePilot/cache:/moviepilot/.cache
      # RO: reference
      - /mnt/sda1/Works/MUBEY/MoviePilot:/mnt/sda1/Works/MUBEY/MoviePilot:ro
      - /mnt/sda1/Configs/mihomo:/mnt/sda1/Configs/mihomo:ro
      - /mnt/sda1/Media:/mnt/sda1/Media:ro
      - /home/mubey:/home/mubey:rw
      - /home/mubey/Downloads:/downloads:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
