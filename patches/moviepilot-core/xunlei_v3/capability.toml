schema_version = 1
id = "XunleiModule"
kind = "host_module"
entrypoint = "app.modules.xunlei:XunleiModule"
depends_on = []

[metadata]
name = "Xunlei"
type = "downloader"
subtype = "Xunlei"
priority = 10

[activation]
policy = "when_configured"
watch = ["Downloaders"]

[activation.selector]
kind = "system_config_item"
key = "Downloaders"
match_field = "type"
match_value = "xunlei"
enabled_field = "enabled"
