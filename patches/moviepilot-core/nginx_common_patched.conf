
# 公共根目录
root /public;

# 主应用路由 - index.html 每次可能被注入脚本，必须 no-cache
location / {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
}

# 本地CookieCloud
location /cookiecloud {
    proxy_pass http://backend_api;
    rewrite ^.+mock-server/?(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;
    proxy_set_header Connection "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Nginx-Proxy true;
    proxy_read_timeout 600s;
}

# SSE特殊配置
location ~ ^/api/v1/system/(message|progress/) {
    default_type text/event-stream;
    add_header Cache-Control no-cache;
    add_header X-Accel-Buffering no;
    proxy_buffering off;
    proxy_cache off;
    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
}

# API代理配置
location /api {
    proxy_pass http://backend_api;
    rewrite ^.+mock-server/?(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_redirect off;
    proxy_set_header Connection "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Nginx-Proxy true;
    proxy_read_timeout 600s;
}

# 插件联邦组件静态文件 - 转发到后端（否则会被 /assets/ 正则截胡返回 404）
location ^~ /plugin/file/ {
    proxy_pass http://backend_api/api/v1/plugin/file/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
}

# assets 目录下的 JS/CSS 带hash 文件名用长期缓存
location ~* ^/assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Vary Accept-Encoding;
}

# 图片类静态资源
location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# 站点图标
location /api/v1/site/icon/ {
    proxy_cache my_cache;
    proxy_cache_valid 200 302 1h;
    proxy_cache_valid any 5m;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_pass http://backend_api;
}
